[project]
name = "ai-checker"
version = "3.1.0"
description = "Unified AI text detector: RoBERTa-large + Desklib DeBERTa-v3 + GPT-2 perplexity + pattern rules + QuillBot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "transformers>=5.7",
    "torch>=2.11",
    "numpy>=2.4",
    "sentencepiece>=0.2",
    "safetensors>=0.7",
    "huggingface_hub>=1.13",
    "requests>=2.33",
    "playwright>=1.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-checker = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
