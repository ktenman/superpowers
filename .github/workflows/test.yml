name: Tests

# The offline suites: everything under tests/ that needs no coding-agent CLI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          pipx install pytest
          npm ci --prefix tests/brainstorm-server --no-audit --no-fund
          command -v dot >/dev/null || sudo apt-get install -y --no-install-recommends graphviz

      - run: tests/run-offline-tests.sh
